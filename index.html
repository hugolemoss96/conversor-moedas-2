<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Conversor 2</title>
</head>

<body>
    <img class="logo-central" src="./img/logo-dinheiro.avif" alt="logo=moeda">
    <main>
        <label>Converter <b>de</b>
            <select>
                <option value="real">$ Real brasileiro</option>
            </select>
        </label>

        <label>Converter <b>para</b>
            <select id="alterar-moeda">
                <option value="dolar">US$ Dólar americano</option>
                <option value="euro">Euro</option>
                <option value="libra">Libra</option>
                <option value="bitcoin">Bitcoin</option>
            </select>
        </label>

        <label>Valor
            <input id="valor-digitado" placeholder="R$ 0.000,00">
        </label>

        <button id="botao">Converter</button>

        <section>
            <img class="moeda" src="./img/real.png" alt="moeda-real">
            <p>Real</p>
            <h1 id="valor-a-converter">R$ 0.000,00</h1>

            <img class="seta" src="./img/seta.png" alt="seta-vetor">

            <img class="moeda" src="./img/dolar.png" id="moeda-troca" alt="moeda-dolar">
            <p id="nome-moeda">Dólar Americano</p>
            <h1 id="moeda-convertida">US$ 0.000,00</h1>
        </section>
    </main>
    
</body>

<script src="./script.js">
    
</script>

</html>
